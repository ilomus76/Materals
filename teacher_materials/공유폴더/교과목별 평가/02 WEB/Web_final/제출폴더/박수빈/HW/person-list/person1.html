<style>


.profile-page{

.profile-header{

    align-items:center;

    gap:50px;

    border-radius:20px;

    box-shadow:

.profile-img{

    object-fit:cover;

<script>


function like(btn){


    let num =
    btn.innerText
    .replace("❤️","")
    .replace(",","")
    .trim();


    num = Number(num)+1;


    btn.innerText =
    "❤️ " + num.toLocaleString();


}


</script>
