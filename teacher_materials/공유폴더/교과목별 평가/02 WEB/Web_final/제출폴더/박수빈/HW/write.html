<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>독서 기록 작성</title>

<link rel="stylesheet" href="./css/write.css">

</head>


<body>


<div class="board_wrap">


<div class="board_title">

<h2>독서 기록 - 새 글 작성</h2>

<p>읽은 책과 감상을 기록하세요.</p>

</div>



<form id="writeForm">


<div class="board_write">


<div class="title">

<div class="col_label">제목</div>

<div class="col_input">

<input 
type="text"
id="title"
placeholder="제목 입력">

</div>

</div>



<div class="title">

<div class="col_label">책 제목</div>

<div class="col_input">

<input
type="text"
id="book"
placeholder="책 제목 입력">

</div>

</div>



<div class="title">

<div class="col_label">비밀번호</div>

<div class="col_input">

<input
type="password"
id="password"
placeholder="수정용 비밀번호">

</div>

</div>



<div class="content">

<textarea
id="content"
placeholder="독후감 입력">
</textarea>

</div>


</div>


<div class="btn_wrap">

<button type="submit">
저장
</button>


<button type="button" onclick="loadPage('record.html')">
취소
</button>


</div>


</form>


</div>



<script src="./js/write.js"></script>


</body>

</html>
