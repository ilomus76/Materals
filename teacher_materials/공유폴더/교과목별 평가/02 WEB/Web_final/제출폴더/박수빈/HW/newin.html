<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>회원가입</title>

<link rel="stylesheet" href="./css/newin.css">

</head>


<body>


<div id="wrap">


<h2>YArrBook 회원가입</h2>

<p>프로필과 계정을 만들어보세요.</p>



<img id="img1" 
src="./image/ms_01.png">



<input 
type="file"
id="in1"
accept="image/*">



<input
type="text"
id="nickname"
placeholder="닉네임">



<input
type="email"
id="email"
placeholder="이메일">



<input
type="password"
id="password"
placeholder="비밀번호">



<button id="btn1">
회원가입
</button>



</div>



<script src="./js/newin.js"></script>


</body>

</html>
