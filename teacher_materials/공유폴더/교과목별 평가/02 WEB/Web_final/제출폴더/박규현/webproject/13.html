<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공연 축제 플랫폼</title>
    <link rel="stylesheet" href="13.css">
</head>
<body>

    <!-- ================= 1. 인증 박스 영역 ================= -->
    <div id="authBox" class="auth-container">
        <h2 id="authTitle">공연 축제 로그인</h2>
        
        <!-- 로그인 화면 -->
        <div id="loginForm">
            <label for="loginId">아이디</label>
            <input type="text" id="loginId" placeholder="아이디를 입력하세요">
            <label for="loginPw">비밀번호</label>
            <input type="password" id="loginPw" placeholder="비밀번호를 입력하세요">
            <div class="remember-me">
                <input type="checkbox" id="saveIdCheck"> 
                <label for="saveIdCheck">아이디 저장</label>
            </div>
            <button class="auth-btn" onclick="handleLogin()">로그인</button>
        </div>

        <!-- 회원가입 화면 -->
        <div id="registerForm" style="display: none;">
            <label for="regId">사용할 아이디</label>
            <input type="text" id="regId" placeholder="아이디 생성">
            <label for="regPw">비밀번호</label>
            <input type="password" id="regPw" placeholder="비밀번호 생성">
            <button class="auth-btn" style="background:#2ecc71;" onclick="handleRegister()">회원가입 완료</button>
        </div>

        <!-- 아이디 찾기 화면 -->
        <div id="findIdForm" style="display: none;">
            <p class="form-desc">로컬 가상 DB에 등록된 사용자의 아이디 목록을 조회합니다.</p>
            <button class="auth-btn" style="background:#9b59b6;" onclick="executeFindId()">등록된 아이디 목록 조회</button>
            <div id="findIdResult" class="find-result-box"></div>
        </div>

        <!-- 비밀번호 찾기 화면 -->
        <div id="findPwForm" style="display: none;">
            <p class="form-desc">비밀번호를 찾고자 하는 아이디를 입력해 주세요.</p>
            <label for="findPwId">아이디 입력</label>
            <input type="text" id="findPwId" placeholder="아이디를 입력하세요">
            <button class="auth-btn" style="background:#e67e22;" onclick="executeFindPw()">비밀번호 조회</button>
            <div id="findPwResult" class="find-result-box"></div>
        </div>

        <!-- 하단 이동 메뉴 고정 -->
        <div class="auth-footer">
            <span onclick="toggleAuthMode('findId')">아이디 찾기</span>
            <span onclick="toggleAuthMode('findPw')">비밀번호 찾기</span>
            <span id="toggleAuthLink" onclick="toggleAuthMode('register')">회원가입</span>
        </div>
    </div>

    <!-- ================= 2. 메인 화면 영역 ================= -->
    <div id="mainPage" class="main-container">
        <!-- 좌측 메뉴 탭 -->
        <div class="sidebar">
            <div class="sidebar-header">
                축제플랫폼 
                <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
            </div>
            <div id="menuAccordion"></div>
        </div>

        <!-- [index.html의 content-header 영역부터 boardListSection 전체 교체] -->
<div class="content-area"> 
    <div class="content-header">
        <h2 id="currentMenuTitle">Life On Festival</h2>
        
        <!-- 📌 [신규] 보기 형태 스타일 토글 스위치 (글쓰기 버튼 왼쪽 배치) -->
        <div id="viewToggleGroup" style="display:none; align-items:center; gap:15px; background:#fff; padding:6px 12px; border-radius:20px; border:1px solid #ddd; font-size:13px; font-weight:bold;">
            <label style="cursor:pointer; display:flex; align-items:center; gap:4px;">
                <input type="radio" name="boardViewType" value="list" checked onclick="switchBoardView('list')"> 📋 글형
            </label>
            <label style="cursor:pointer; display:flex; align-items:center; gap:4px;">
                <input type="radio" name="boardViewType" value="gallery" onclick="switchBoardView('gallery')"> 🖼️ 갤러리형
            </label>
        </div>

        
    </div>
    <<div class="btn-group" id="boardActionGroup" style="margin-top: 20px; display: none; gap: 8px;">
    <!-- 📌 두 버튼 모두 기본 상태는 부모 박스가 display:none 이므로 자동으로 숨겨집니다 -->
    <button class="btn btn-danger" id="btnDeleteSelected" onclick="deleteSelectedPosts()">선택 항목 삭제</button>
    <button class="btn btn-primary" id="btnNewPost" onclick="openNewPostForm()">글쓰기</button>
</div>
    <!-- 통합 게시판 리스트 섹션 -->
    <div id="boardListSection" style="display: none;">
        
        <!-- [1] 기존 글형 테이블 뷰 -->
        <table class="board-table" id="boardTableView">
            <thead>
                <tr>
                    <th style="width: 50px;"><input type="checkbox" id="thCheckAll" onclick="toggleSelectAll(this)"></th>
                    <th style="width: 60px;">번호</th>
                    <th>제목</th>
                    <th style="width: 100px;">작성자</th>
                    <th style="width: 110px;">작성일자</th>
                    <th style="width: 110px;">수정일자</th>
                    <th style="width: 70px;">조회수</th>
                    <th style="width: 100px;">접근권한</th>
                    <th style="width: 90px;">비고</th>
                </tr>
            </thead>
            <tbody id="boardTbody"></tbody>
        </table>

        <!-- 📌 [2] [신규] 갤러리형 카드 격자 뷰 (초기 숨김) -->
        <div id="boardGalleryView" class="gallery-grid" style="display: none;"></div>

        
    </div>
            <!-- 글 목록 화면 -->
            <div id="boardListSection" style="display: none;">
    <table class="board-table">
        <thead>
            <tr>
                <!-- 8개 항목 규격 명시 -->
                <th style="width: 50px;"><input type="checkbox" id="thCheckAll" onclick="toggleSelectAll(this)"></th>
                <th style="width: 60px;">번호</th>
                <th>제목</th>
                <th style="width: 100px;">작성자</th>
                <th style="width: 110px;">작성일자</th>
                <th style="width: 110px;">수정일자</th>
                <th style="width: 110px;">조회수</th>
                <th style="width: 100px;">접근권한</th>
                <th style="width: 90px;">비고</th>
            </tr>
        </thead>
        <tbody id="boardTbody">
            <!-- 13.js 스크립트에 의해 8개 열 데이터가 동적 주입됩니다 -->
        </tbody>
    </table>

</div>
            <!-- 상세 게시판 입력창 및 이미지 뷰어 -->
            <div id="boardFormSection" class="board-form-container">
                <input type="hidden" id="formPostId">
                <label for="formTitle">제목</label>
                <input type="text" id="formTitle" placeholder="제목을 입력하세요">
                <div style="margin-top: 10px; margin-bottom: 10px; font-size: 13px; color: #7f8c8d; display: flex; gap: 15px;">
                    <span>👀 조회수: <span id="formViews" style="font-weight: bold; color: #2c3e50;">0</span></span>
                </div>
                
                <label for="formWriter">작성자</label>
                <input type="text" id="formWriter" readonly>
                
                <!-- 파일 첨부 컴포넌트 -->
                <div class="file-upload-area" id="uploadWrapper">
                    <label style="font-weight: bold; font-size: 14px;">📎 파일 및 이미지 다중 첨부 (여러 개 선택 가능)</label>
                    <input type="file" id="formFile" style="margin-top: 10px;" multiple onchange="handleFileSelect(this)">
                </div>

                <!-- 첨부된 다중 파일 명단 컨테이너 -->
                <div id="fileListContainer" style="margin-bottom: 15px; font-size: 13px; color: #555; background: #fff; border: 1px solid #ddd; padding: 10px; display: none; border-radius: 4px;">
                    <p style="font-weight: bold; margin-bottom: 5px; color: #2c3e50;">📎 첨부된 파일 목록 (❌ 버튼을 눌러 제외 가능):</p>
                    <!-- 📌 스타일을 깔끔하게 다듬고 개별 삭제 아이템이 주입될 공간 -->
                    <ul id="fileUl" style="list-style-type: none; padding-left: 0; margin: 0; display: flex; flex-direction: column; gap: 6px;"></ul>
                </div>

                <!-- 이미지 본문 노출 박스 -->
                <div class="image-preview-box" id="imagePreviewBox">
                    <p style="font-size: 12px; color: #7f8c8d; text-align: left; margin-bottom: 8px;">🖼️ 본문 첨부 이미지 미리보기 (마우스 호버 시 확대):</p>
                    <div id="previewImagesWrapper" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;"></div>
                </div>

                <label for="formContent" style="margin-top: 15px; display: block;">내용</label>
                <textarea id="formContent" rows="10" placeholder="내용을 입력하세요"></textarea>
                
                <!-- 비밀글 비밀번호 설정 자유선택 -->
                <div class="secret-option">
                    <input type="checkbox" id="formIsSecret" onclick="toggleSecretPwdInput(this.checked)">
                    <label for="formIsSecret">비밀번호로 이 글 보호하기 (자유 설정)</label>
                    <input type="password" id="formSecretPw" class="secret-pwd-input" placeholder="비밀번호">
                </div>

                <!-- 💬 [신규 수용 확인] 댓글 영역 시스템 레이아웃 -->
                <div id="commentSection" style="margin-top: 30px; border-top: 1px dashed #ccc; padding-top: 20px;">
                    <h3 style="font-size: 15px; color: #2c3e50; margin-bottom: 10px;">💬 댓글 (<span id="commentCount">0</span>)</h3>
                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <input type="text" id="commentInput" placeholder="댓글을 입력해 주세요 (로그인 유저만 가능)" style="margin: 0; flex: 1;">
                        <button type="button" class="btn btn-primary" style="padding: 10px 20px;" onclick="saveComment()">등록</button>
                    </div>
                    <div id="commentListContainer" style="background: #f8f9fa; border-radius: 4px; padding: 10px; border: 1px solid #eee;">
                        <ul id="commentUl" style="list-style-type: none; padding: 0;"></ul>
                    </div>
                </div>
                
                <div class="btn-group" style="margin-top: 20px;">
                    <button class="btn btn-secondary" onclick="closeFormSection()">목록으로</button>
                    <button class="btn btn-primary" id="btnSavePost" onclick="savePost()">저장하기</button>
                    <button class="btn btn-danger" id="btnDeletePost" style="display:none;" onclick="deleteSinglePost()">삭제하기</button>
                </div>
            </div>
        </div>
    </div>

    <script src="13.js"></script>
    
</body>
</html>
