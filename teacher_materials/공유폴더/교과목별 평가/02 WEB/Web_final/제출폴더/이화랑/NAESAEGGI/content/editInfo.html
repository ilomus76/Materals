<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 수정</title>

    <link rel="stylesheet" href="../css/login.css">

    <script src="../js/editInfo.js"></script>
</head>
<body>
    <div class="wrap">
        <form>
            <div class="title">비밀번호 수정</div>
            <div class="logo"><img src="../image/footprint.png" alt="foontprint"></div>
            <div class="in_id">
                ID <input type="text" id="in_id" readonly>
            </div>
            <div class="in_pw">
                PW <input type="password" id="in_pw" placeholder="변경할 비밀번호 입력">
            </div>
            <div class="notice">※ 비밀번호는 영어 소문자로 시작하고 4글자 이상이어야 합니다</div>
            <div class="btn">
                <button type="button" onclick="updateInfo()">비밀번호 변경하기</button>
            </div>
        </form>
    </div>
    
</body>
</html>
