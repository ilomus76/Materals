<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>

    <link rel="stylesheet" href="./css/login.css">

    <script src="./js/regi.js"></script>
</head>
<body>
    <div class="wrap">
        <form>
            <div class="title">회원가입</div>
            <div class="logo"><img src="./image/footprint.png" alt="foontprint"></div>
            <div class="in_id">
                ID <input type="text" id="in_id" placeholder="아이디 입력">
            </div>
            <div class="in_pw">
                PW <input type="password" id="in_pw" placeholder="회원가입 입력">
            </div>
            <div class="notice">※ 비밀번호는 영어 소문자로 시작하고 4글자 이상이어야 합니다</div>
            <div class="btn">
                <button type="button" onclick="register()">회원가입하기</button>
            </div>
        </form>
    </div>
    
</body>
</html>
