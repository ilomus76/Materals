<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - 수정</title>

    <link rel="stylesheet" href="../../css/meeting.css">

    <script src="../../js/edit.js"></script>
</head>
<body>
    <div class="wrap">
        <form onsubmit="editBoard(event)">
            <div class="btn" id="submit">
                <button type="submit">
                    <img src="../../image/check.png" alt="check">
                    수정
                </button>
                <a href="./meeting.html" id="cancel">취소</a>
            </div>
            <div class="box">
                <div class="inner_box title">
                    <input type="text" placeholder="제목" id="in_title">
                </div>
                <div class="inner_box writer">
                    <input type="text" placeholder="글쓴이" id="in_writer">
                </div>
                <div class="inner_box date">
                    <span id="in_date"></span>
                </div>
                <div class="inner_box msg">
                    <textarea placeholder="내용" id="in_msg"></textarea>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
