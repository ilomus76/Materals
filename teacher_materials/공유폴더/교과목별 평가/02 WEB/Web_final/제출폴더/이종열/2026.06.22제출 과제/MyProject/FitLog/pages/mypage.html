<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/mypage.css">

    <script src="../js/mypage.js" defer></script>
</head>
<body>

    <header>
        <!-- 앱 로고 영역 -->
        <div id="app_logo">
            <h1>FitLog</h1>
        </div>
        <h1>MY PAGE</h1>
    </header>

    <main>
        
        <!-- 프로필 -->
        <section id="profileSection">

            <h2>내 정보</h2>
            <div id="profileCard">
                <img id="profileImage" src="../images/free-icon-user.png" alt="프로필">
                <p id="profileName"></p>
                <p id="profileEmail"></p>
            </div>

        </section>
        
        <!-- 누적 운동 수 -->
        <section id="statusSection">
            <h2>운동 통계</h2>

            <p>
                <span class="label">운동 완료율</span>
                <span class="value" id="completionRate">0%</span>
            </p>
            <p>
                <span class="label">진행 중인 운동</span>
                <span class="value" id="myExerciseCount">0개</span>
            </p>

            <p>
                <span class="label">총 운동 시간</span>
                <span class="value" id="myExerciseTime">0분</span>
            </p>

            <p>
                <span class="label">완료 운동</span>
                <span class="value" id="myCompletedCount">0개</span>
            </p>

            <p>
                <span class="label">완료 운동 시간</span>
                <span class="value" id="myCompletedTime">0분</span>
            </p>
        </section>

        <!-- 작성 게시글 수 -->
        <section id="allBoardCount">
            <h2>내 게시글</h2>

            <p>작성 게시글 수: <span id="myBoardCount">0</span>개</p>
        </section>

        <!-- 로그아웃, 프로필 수정, 비밀번호 변경 기능 넣기 -->
        <section id="settingSection">
            <h2>설정</h2>
            <button id="logoutBtn">로그아웃</button>
        </section>

        <!-- 즐겨찾기 gym, 게시글 -->
        <section id="favoritesSection">
            <div id="favoritesBoard"></div>
            <div id="favoritesGym"></div>
        </section>
        
    </main>

    <!-- 하단 바 영역 -->
    <nav id="bottom_bar">
        <ul>
            <li><a href="../index.html">홈</a></li>
            <li><a href="./board.html">게시판</a></li>
            <li><a href="./gym.html">헬스장</a></li>
            <li><a href="./weather.html">날씨 기반 운동 추천</a></li>
            <li><a href="./mypage.html">마이</a></li>
        </ul>
    </nav>
    
</body>
</html>
