<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입페이지</title>
    <style>
        #wrap{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #logo{
            width: 300px;
            height: 300px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid black;
            margin-bottom: 10px;
        }
        .input-box {
            width: 340px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .input-box input {
            width: 250px;
            padding: 8px;
            box-sizing: border-box;
        }
        #login {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            width: 340px;
        }
        #login2 {
            width: 100%;
            height: 45px;
            cursor: pointer;
            background-color: #004fb8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
  <form action="./login.php" method="POST" enctype="multipart/form-data" id="wrap">
    <div>
        <img id="logo" src="https://tjsdn7124.dothome.co.kr/Data/disney.png" alt="disney">
    </div>
    
    <div class="input-box">
        ID <input type="text" name="loginid" required>
    </div>
    <div class="input-box">
        PW <input type="password" name="loginpw" required>
    </div>
    
    <div class="input-box">
        프로필 <input type="file" name="profile" accept="image/*">
    </div>
    
    <div id="login">
        <button id="login2" type="submit">가입하기</button>    
    </div>
</form>
</body>
</html>
