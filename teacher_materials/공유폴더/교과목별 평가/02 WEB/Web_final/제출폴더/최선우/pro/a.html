<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디즈니월드</title>
    <style>
        #wrap{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }
        #logo{
            width: 300px;
            height: 300px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid black;
            margin-bottom: 10px;
        }
        #login {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            width: 340px;
        }

        
        .login1, #login2 {
            flex: 1;                 
            height: 48px;

            justify-content: center;
            align-items: center;

            border: none;
            outline: none;
            
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-sizing: border-box;
            
            background-color: #004fb8; 
            color: #ffffff;
        }

        
        




    </style>
</head>
<body>
    <form action="login.php" method="POST" id="wrap">

        <img id="logo" src="https://tjsdn7124.dothome.co.kr/Data/disney.png" alt="disney">
    </div>
    
    <div class="input-box">
        ID <input type="text" id="loginid" name="loginid" required>
    </div>
    <div class="input-box">

    </div>
    
    <div id="login">
