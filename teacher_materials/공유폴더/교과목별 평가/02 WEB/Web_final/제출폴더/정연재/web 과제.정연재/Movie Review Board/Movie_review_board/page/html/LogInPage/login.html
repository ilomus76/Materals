<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화리뷰사이트 - 로그인</title>

    <link rel="stylesheet" href="../../css/LoginPage/login.css">
</head>
<body>
    <div class="container">
        <div class="login_wrap">
            <div class="login_logo">
                <a href="../../html/HomePage/home_list.html">
                    <img src="../../image/top_logo.png" alt="logo">
                </a>
                </div>
            <div class="write_id_wrap">
                <input type="text" placeholder="아이디" id="user_id">
            </div>
            <div class="write_pw_wrap">
                <input type="password" placeholder="비밀번호" id="user_pw">
            </div>
            <div class="login_btn_wrap">
                <button type="button" onclick="login()">로그인</button>
            </div>
            <div class="join_link">
                <a href="../../html/JoinPage/join.html">회원가입</a>
            </div>
        </div>
    </div>
    
    <script src="../../js/login.js"></script>
    <script src="../../js/common.js"></script>
</body>
</html>
